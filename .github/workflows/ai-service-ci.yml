name: AI Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'myjudicial-ai-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'myjudicial-ai-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/ai-service-ci.yml'

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: docker.io/mfitumukiza250/myjudicial

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: myjudicial-ai-service/requirements.txt

      - name: Install dependencies
        working-directory: myjudicial-ai-service
        run: |
          pip install --upgrade pip
          # openai-whisper ships as a legacy sdist whose setup.py imports
          # pkg_resources. Build it without PEP 517 isolation (as the
          # Dockerfile does) against a setuptools that still ships it.
          pip install "setuptools<81" wheel
          pip install --no-build-isolation openai-whisper==20240930
          pip install flake8
          pip install pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: myjudicial-ai-service
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with pytest
        working-directory: myjudicial-ai-service
        run: pytest tests/ -v

  deploy:
    # Deploy jobs are serialized on the VPS by an in-band flock(1) lock. A
    # GitHub concurrency group is deliberately NOT used here: group semantics
    # cancel older queued jobs when a newer one arrives, silently dropping a
    # service's deploy. flock keeps every deploy running into completion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: myjudicial-ai-service
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:ai-${{ github.sha }}
            ${{ env.IMAGE }}:ai-latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Deploy pinned tag to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            exec 9> /tmp/myjudicial-deploy.lock
            flock -x -w 1200 9 || { echo "ERROR: deploy lock busy > 20min"; exit 1; }

            # Free disk space: old tagged images accumulate across deployments.
            docker system prune -af || true
            docker builder prune -af || true

            git pull --ff-only origin main

            if grep -q '^AI_TAG=' .env; then
              sed -i "s|^AI_TAG=.*|AI_TAG=${{ github.sha }}|" .env
            else
              echo "AI_TAG=${{ github.sha }}" >> .env
            fi

            # Retry pulls - the VPS's international route is lossy
            pulled=0
            for attempt in 1 2 3 4 5; do
              if docker compose pull ai; then pulled=1; break; fi
              echo "pull attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            if [ "$pulled" != "1" ]; then
              echo "WARN: pull failed after retries - falling back to building on VPS"
              docker compose build ai
            fi
            docker compose up -d ai

            ok=0
            for i in $(seq 1 40); do
              if docker compose ps ai | grep -q '(healthy)'; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: ai did not become healthy after deploy"
              docker compose logs --tail 50 ai
              exit 1
            fi
            echo "AI service deployed and healthy."



