name: AI Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'myjudicial-ai-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'myjudicial-ai-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/ai-service-ci.yml'

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/regismfitumukiza/myjudicial-ai

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: myjudicial-ai-service/requirements.txt

      - name: Install dependencies
        working-directory: myjudicial-ai-service
        run: |
          pip install --upgrade pip
          pip install flake8
          pip install pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: myjudicial-ai-service
        run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test with pytest
        working-directory: myjudicial-ai-service
        run: pytest tests/ -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: myjudicial-ai-service
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

      - name: Deploy pinned tag to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git pull origin main

            if grep -q '^AI_TAG=' .env; then
              sed -i "s|^AI_TAG=.*|AI_TAG=${{ github.sha }}|" .env
            else
              echo "AI_TAG=${{ github.sha }}" >> .env
            fi

            if ! docker compose pull ai; then
              echo "WARN: pull failed - falling back to building on VPS"
              docker compose build ai
            fi
            docker compose up -d ai

            ok=0
            for i in $(seq 1 40); do
              if docker compose ps ai | grep -q '(healthy)'; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: ai did not become healthy after deploy"
              docker compose logs --tail 50 ai
              exit 1
            fi
            echo "AI service deployed and healthy."
