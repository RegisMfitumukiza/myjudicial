name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'myjudicial-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'myjudicial-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: docker.io/mfitumukiza250/myjudicial

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: myjudicial-backend/package-lock.json

      - name: Install dependencies
        working-directory: myjudicial-backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: myjudicial-backend
        run: npx prisma generate

      - name: Test
        working-directory: myjudicial-backend
        run: npm test

      # OpenAPI-first guardrail: the committed spec snapshot (../openapi/api-docs.json)
      # must always match the registry. If code changed docs and forgot to run
      # `npm run export:openapi`, this step fails loudly and blocks the merge.
      - name: OpenAPI spec drift check
        working-directory: myjudicial-backend
        run: |
          npm run export:openapi
          git diff --exit-code -- ../openapi/api-docs.json

  deploy:
    # Deploy jobs are serialized on the VPS by an in-band flock(1) lock
    # (/tmp/myjudicial-deploy.lock, held for the whole SSH session). We do NOT
    # use a GitHub concurrency group here: group semantics cancel older queued
    # jobs in favor of newer ones ("higher priority waiting request"), which
    # would silently drop a service's deploy. flock keeps every deploy running
    # until the lock is free, and `-w` turns any starvation into a loud error.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: myjudicial-backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:backend-${{ github.sha }}
            ${{ env.IMAGE }}:backend-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy pinned tag to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            # In-band lock serializes ALL deploys (backend/frontend/ai/tunnel)
            # plus manual deploys: one SSH session holds /tmp/myjudicial-deploy.lock
            # until it exits, so .env/git/daemon operations are atomic. `-w 1200`
            # aborts after 20min of starvation with a loud error instead of
            # hanging the job forever.
            exec 9> /tmp/myjudicial-deploy.lock
            flock -x -w 1200 9 || { echo "ERROR: deploy lock busy > 20min"; exit 1; }

            # Free disk space: prune stopped containers, unused tagged images and build cache
            echo "=== VPS disk before pre-deploy cleanup ==="
            df -h /
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker system prune -f || true
            echo "=== VPS disk after pre-deploy cleanup ==="
            df -h /

            # --ff-only: single deploy at a time, so any divergence is a real
            # conflict (e.g. local edits on the VPS) and must fail loudly.
            git pull --ff-only origin main

            # Pin the deployed tag so reboots/recreates survive rollbacks
            if grep -q '^BACKEND_TAG=' .env; then
              sed -i "s|^BACKEND_TAG=.*|BACKEND_TAG=${{ github.sha }}|" .env
            else
              echo "BACKEND_TAG=${{ github.sha }}" >> .env
            fi

            # Prefer registry image; fall back to building on the VPS while
            # Docker Hub login is not yet configured there.
            # Retry pulls - the VPS's international route is lossy
            pulled=0
            for attempt in 1 2 3 4 5; do
              if docker compose pull backend; then pulled=1; break; fi
              echo "pull attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            if [ "$pulled" != "1" ]; then
              echo "WARN: pull failed after retries - falling back to building on VPS"
              docker compose build backend
            fi
            docker compose up -d --no-deps backend

            # Post-deploy health gate
            ok=0
            for i in $(seq 1 30); do
              if docker compose ps backend | grep -q '(healthy)'; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: backend did not become healthy after deploy"
              docker compose logs --tail 50 backend
              exit 1
            fi
            echo "Backend deployed and healthy."

            # Post-deploy prune to drop superseded container image
            docker image prune -af || true
            echo "=== VPS disk after post-deploy cleanup ==="
            df -h /
