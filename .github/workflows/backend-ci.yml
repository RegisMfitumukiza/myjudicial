name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'myjudicial-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'myjudicial-backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: docker.io/mfitumukiza250/myjudicial

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: myjudicial-backend/package-lock.json

      - name: Install dependencies
        working-directory: myjudicial-backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: myjudicial-backend
        run: npx prisma generate

      - name: Test
        working-directory: myjudicial-backend
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: myjudicial-backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:backend-${{ github.sha }}
            ${{ env.IMAGE }}:backend-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy pinned tag to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git pull origin main

            # Pin the deployed tag so reboots/recreates survive rollbacks
            if grep -q '^BACKEND_TAG=' .env; then
              sed -i "s|^BACKEND_TAG=.*|BACKEND_TAG=${{ github.sha }}|" .env
            else
              echo "BACKEND_TAG=${{ github.sha }}" >> .env
            fi

            # Prefer registry image; fall back to building on the VPS while
            # Docker Hub login is not yet configured there.
            # Retry pulls - the VPS's international route is lossy
            pulled=0
            for attempt in 1 2 3 4 5; do
              if docker compose pull backend; then pulled=1; break; fi
              echo "pull attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            if [ "$pulled" != "1" ]; then
              echo "WARN: pull failed after retries - falling back to building on VPS"
              docker compose build backend
            fi
            docker compose up -d backend

            # Post-deploy health gate
            ok=0
            for i in $(seq 1 30); do
              if docker compose ps backend | grep -q '(healthy)'; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: backend did not become healthy after deploy"
              docker compose logs --tail 50 backend
              exit 1
            fi
            echo "Backend deployed and healthy."


