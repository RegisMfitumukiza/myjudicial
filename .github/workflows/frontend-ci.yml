name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'myjudicial-frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'myjudicial-frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: docker.io/mfitumukiza250/myjudicial

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: myjudicial-frontend/package-lock.json

      - name: Install dependencies
        working-directory: myjudicial-frontend
        run: npm ci

      - name: TypeScript check
        working-directory: myjudicial-frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: myjudicial-frontend
        run: npm run lint

      - name: Test
        working-directory: myjudicial-frontend
        run: npm run test

  deploy:
    # Deploy jobs are serialized on the VPS by an in-band flock(1) lock. A
    # GitHub concurrency group is deliberately NOT used here: group semantics
    # cancel older queued jobs when a newer one arrives, silently dropping a
    # service's deploy. flock keeps every deploy running into completion.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined into the JS bundle at build time, so the
      # registry build must receive the production values here. Configure
      # these repository secrets (Settings > Secrets > Actions).
      - name: Verify required secrets are configured
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          missing=0
          for s in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_API_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY AUTH_SECRET; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret: $s"; missing=1; fi
          done
          exit $missing

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: myjudicial-frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:frontend-${{ github.sha }}
            ${{ env.IMAGE }}:frontend-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_PREFIX=/api/v1
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_LIVEKIT_URL=${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
            AUTH_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}

      - name: Deploy pinned tag to VPS
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            exec 9> /tmp/myjudicial-deploy.lock
            flock -x -w 1200 9 || { echo "ERROR: deploy lock busy > 20min"; exit 1; }

            # Free disk space: prune stopped containers, unused tagged images and build cache
            echo "=== VPS disk before pre-deploy cleanup ==="
            df -h /
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker system prune -f || true
            echo "=== VPS disk after pre-deploy cleanup ==="
            df -h /

            git pull --ff-only origin main

            if grep -q '^FRONTEND_TAG=' .env; then
              sed -i "s|^FRONTEND_TAG=.*|FRONTEND_TAG=${{ github.sha }}|" .env
            else
              echo "FRONTEND_TAG=${{ github.sha }}" >> .env
            fi

            # Retry pulls - the VPS's international route is lossy
            pulled=0
            for attempt in 1 2 3 4 5; do
              if docker compose pull frontend; then pulled=1; break; fi
              echo "pull attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            if [ "$pulled" != "1" ]; then
              echo "WARN: pull failed after retries - falling back to building on VPS"
              docker compose build frontend
            fi
            docker compose up -d --no-deps frontend

            ok=0
            for i in $(seq 1 24); do
              if docker compose ps frontend | grep -q '(healthy)\|Up '; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: frontend did not come up after deploy"
              docker compose logs --tail 50 frontend
              exit 1
            fi
            echo "Frontend deployed."

            # Post-deploy prune to drop superseded container image
            docker image prune -af || true
            echo "=== VPS disk after post-deploy cleanup ==="
            df -h /
