name: Production Smoke

on:
  schedule:
    # Hourly sanity check of the public surface: catches nobody-noticed
    # regressions (frontend down, API unhealthy through the tunnel, routes
    # missing/opened up) between deploy pushes.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke.mjs'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run production smoke tests (internal — bypasses Cloudflare bot challenge)
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            # Ensure the smoke script is current (VPS repo may lag behind push)
            git pull --ff-only origin main || true
            # Three global rounds: a push-triggered run can race the deploy
            # (frontend/backend roll takes minutes). Each round already retries
            # individual checks; outer rounds give deploy up to ~7m to settle.
            for round in 1 2 3; do
              echo "=== smoke round $round/3 (internal network) ==="
              if docker run --rm \
                --network myjudicial_myjudicial-network \
                -e SMOKE_API_URL=http://backend:4000 \
                -e SMOKE_WEB_URL=http://frontend:3000 \
                -v "$(pwd)/scripts/smoke.mjs:/smoke.mjs:ro" \
                node:20-slim node /smoke.mjs; then
                exit 0
              fi
              [ "$round" -lt 3 ] && sleep 120
            done
            exit 1