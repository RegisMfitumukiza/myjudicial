name: Cloudflare Tunnel Deploy

on:
  push:
    branches: [main]
    paths:
      - 'caddy/**'
      - 'docker-compose.yml'
      - '.github/workflows/tunnel-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    # Deploy jobs are serialized on the VPS by an in-band flock(1) lock. A
    # GitHub concurrency group is deliberately NOT used here: group semantics
    # cancel older queued jobs when a newer one arrives, silently dropping a
    # service's deploy. flock keeps every deploy running into completion.
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy tunnel
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            echo "=== Deploying Cloudflare Tunnel ==="
            cd ${{ secrets.APP_DIR }}

            exec 9> /tmp/myjudicial-deploy.lock
            flock -x -w 1200 9 || { echo "ERROR: deploy lock busy > 20min"; exit 1; }

            git pull --ff-only origin main
            docker compose build cloudflared
            docker compose up -d --force-recreate cloudflared
            echo "Cloudflare Tunnel deployed successfully."
            docker compose logs --tail 5 cloudflared
