# ============================================
# Cloudflare Tunnel Configuration - STAGING
# ============================================
# Tunnel: myjudicial-staging
# ID:     468c4c90-445d-460c-9995-4351ce99a07c
# Credentials live on the VPS at ~/.cloudflared/468c4c90-445d-460c-9995-4351ce99a07c.json
# (created via `docker run cloudflare/cloudflared tunnel create` with the origin cert;
#  never commit the credentials file).
#
# DNS (proxied CNAMEs, auto-created via `tunnel route dns`):
#   staging.myjudicial.com      -> 468c4c90-445d-460c-9995-4351ce99a07c.cfargotunnel.com
#   api.staging.myjudicial.com  -> 468c4c90-445d-460c-9995-4351ce99a07c.cfargotunnel.com
#
# Mount points used by docker-compose (staging project):
#   ./caddy/staging-config.yml                        -> /etc/cloudflared/config.yml
#   ~/.cloudflared/468c4c90-...json                   -> /etc/cloudflared/credentials.json
# ============================================

tunnel: 468c4c90-445d-460c-9995-4351ce99a07c
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: staging.myjudicial.com
    service: http://frontend:3000
  - hostname: api.staging.myjudicial.com
    service: http://backend:4000
  # Catch-all for unmatched traffic
  - service: http_status:404
