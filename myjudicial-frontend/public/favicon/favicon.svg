<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <style>
    .badge-bg { fill: url(#bgLight); }
    @media (prefers-color-scheme: dark) {
      .badge-bg { fill: url(#bgDark); }
    }
  </style>
  <rect class="badge-bg" width="64" height="64" rx="14"/>
  <image href="data:image/png;base64," x="8" y="10" width="48" height="44" />
</svg>